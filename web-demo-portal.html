function drawActiveBadges() {

function frame(now) {

  let sx = 0;
  let sy = 0;
  if (shake > 0) {
    sx = (Math.random() - 0.5) * shake;
    sy = (Math.random() - 0.5) * shake;
  }
  ctx2.save();
  ctx2.translate(sx, sy);
  drawBackground();
  drawPipes();
  drawPortals();
  drawParticles();
  drawBird();
  drawPortalWarning();
  drawScore();
  drawActiveBadges();
  drawHearts();
  drawReady();
  ctx2.restore();
  if (flash > 0) {
    ctx2.fillStyle = `rgba(240, 68, 82, ${flash * 0.35})`;
    ctx2.fillRect(0, 0, W, H);
  }
  if (stageFlash > 0) {
    ctx2.fillStyle = `rgba(255, 214, 120, ${stageFlash * 0.4})`;
    ctx2.fillRect(0, 0, W, H);
  }

  drawGameOver();
  drawBoard();
  drawMute();

}
