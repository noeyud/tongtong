name: Supabase Keep-Alive

# Supabase 무료 플랜은 약 7일간 요청이 없으면 프로젝트가 일시정지돼요.
# 매일 한 번 scores 테이블을 가볍게 읽어서 "활동"을 만들어 정지를 막습니다.
# (여기 쓰인 anon 키는 브라우저에 노출되는 공개용 키라 그대로 커밋해도 안전해요.)

on:
  schedule:
    - cron: '17 3 * * *' # 매일 UTC 03:17 (한국시간 12:17)
  workflow_dispatch: {} # Actions 탭에서 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          SUPABASE_URL="https://qdxmexgbvczmlcekuqqj.supabase.co"
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkeG1leGdidmN6bWxjZWt1cXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MjgyMTAsImV4cCI6MjA5NzIwNDIxMH0.VzBYg_07encpuNpnIQqOqe5J_FI3ykwXQS9Kz4k8030"
          CODE=$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/scores?select=id&limit=1" \
            -H "apikey: $ANON" \
            -H "Authorization: Bearer $ANON")
          echo "Supabase 응답 코드: $CODE"
          # Only HTTP 200 confirms a successful database request.
          if [ "$CODE" = "200" ]; then
            echo "keep-alive 성공 ✅"
          else
            echo "::error::Supabase keep-alive failed: HTTP $CODE (expected 200)"
            exit 1
          fi
